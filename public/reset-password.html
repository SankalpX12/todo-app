<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — To-Do App</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <main class="auth-card">
    <h1>Reset password</h1>
    <form id="reset-form">
      <label for="password">New password <span class="hint">(min. 8 characters)</span></label>
      <input type="password" id="password" name="password" required autocomplete="new-password" minlength="8">

      <label for="confirm">Confirm new password</label>
      <input type="password" id="confirm" name="confirm" required autocomplete="new-password" minlength="8">

      <button type="submit">Reset password</button>
    </form>
    <div id="message" class="message" hidden></div>
    <p class="auth-link" id="login-link" hidden><a href="/login.html">← Go to login</a></p>
  </main>
  <script src="/js/reset-password.js"></script>
</body>
</html>
