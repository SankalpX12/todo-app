<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — To-Do App</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <main class="auth-card">
    <h1>Log in</h1>
    <form id="login-form">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autocomplete="email">

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">

      <button type="submit">Log in</button>
    </form>
    <div id="message" class="message" hidden></div>
    <div id="resend-section" hidden>
      <button id="resend-btn" type="button" class="btn-secondary">Resend verification email</button>
    </div>
    <p class="auth-link">No account? <a href="/signup.html">Sign up</a> · <a href="/forgot-password.html">Forgot password?</a></p>
  </main>
  <script src="/js/login.js"></script>
</body>
</html>
